<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风格详情 · UI Atlas</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css?v=15">
</head>
<body>

<header class="dp-head">
  <div class="dp-title">
    <a class="btn" id="d-back" href="index.html">← 返回图鉴</a>
    <div>
      <h2 id="d-name"></h2>
      <p id="d-sub"></p>
    </div>
  </div>
  <div class="detail-actions">
    <a class="btn" id="d-open" target="_blank" rel="noopener">新窗口打开</a>
    <button class="btn" id="d-share">复制分享链接</button>
    <button class="btn" id="d-export-btn" aria-expanded="false" aria-controls="d-export">导出 ▾</button>
  </div>
</header>

<div class="dp-body">
  <div class="stage" id="d-stage">
    <div class="dp-fail" id="d-fail" role="status">
      <span>预览加载失败</span>
      <small id="d-fail-note">可能刚从 file:// 打开，或网络较慢。tokens 编辑与导出不受影响。</small>
      <button id="d-retry" type="button">重试</button>
    </div>
    <iframe id="d-frame" title="风格样例预览"></iframe>
  </div>
  <aside class="side">
    <p class="banner" id="d-banner" hidden></p>

    <section>
      <h3>识别特征</h3>
      <ul id="d-features"></ul>
    </section>

    <section>
      <h3>什么时候不要用</h3>
      <p class="avoid" id="d-avoid"></p>
    </section>

    <section>
      <h3>Tokens <span class="hint">改一下，预览实时变</span></h3>
      <div class="tokens" id="d-tokens"></div>
      <p class="contrast" id="d-contrast"></p>
    </section>

    <section id="d-export" hidden>
      <h3>导出</h3>
      <div class="tabs" role="tablist" aria-label="导出格式">
        <button role="tab" data-fmt="css" aria-selected="true">CSS 变量</button>
        <button role="tab" data-fmt="tailwind" aria-selected="false">Tailwind</button>
        <button role="tab" data-fmt="shadcn" aria-selected="false">shadcn</button>
      </div>
      <pre id="d-export-code" tabindex="0"></pre>
      <button class="btn small" id="d-export-copy">复制这段</button>
    </section>

    <section>
      <h3>给 AI 的提示词</h3>
      <pre id="d-prompt" tabindex="0"></pre>
      <button class="btn small" id="d-copy-prompt">复制提示词</button>
    </section>

    <section>
      <h3>来源与依据</h3>
      <ul class="sources" id="d-sources"></ul>
    </section>
  </aside>
</div>

<script src="detail.js?v=1"></script>
</body>
</html>
