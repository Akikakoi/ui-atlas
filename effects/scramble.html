<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乱码解码 · UI Atlas 动效</title>
<style>
:root{--bg:#0d0f12;--ink:#e9ebef;--muted:#7c818c;--accent:#7ee0a8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(500px 260px at 50% 0%,rgba(60,120,90,.16),transparent 70%),var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
.stage{min-height:100vh;display:grid;place-items:center;padding:38px 20px 74px;text-align:center}
.kicker{margin:0 0 18px;font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.24em;color:var(--muted)}
.code{margin:0;font:600 clamp(19px,4.6vw,34px)/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;
  letter-spacing:.06em;white-space:nowrap;color:var(--accent);text-shadow:0 0 22px rgba(126,224,168,.25)}
.code .dim{color:#3d4a44}
.sub{margin:16px 0 0;font-size:12px;line-height:1.85;color:var(--muted);max-width:30em}
.sub code{color:#b9c4be;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:11.5px}
.again{margin-top:24px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--ink);
  border-radius:999px;padding:7px 16px;font:inherit;font-size:12px;cursor:pointer}
.again:hover{border-color:var(--accent);color:var(--accent)}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (max-width:420px){.code{font-size:16px;letter-spacing:.02em}}
@media (prefers-reduced-motion:reduce){.code{color:var(--ink)}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div>
    <p class="kicker">TYPE / 02</p>
    <p class="code" id="code" aria-label="DECODING INTERFACE">DECODING INTERFACE</p>
    <p class="sub">每个字符有自己的 <code>end</code> 帧。随机字形先占位，从左往右逐个锁定真相，右边还在噪声里。</p>
    <button class="again" id="again" type="button">重新解码</button>
  </div>
</main>
<p class="hint">每 4 秒自动解一次，也可点按钮</p>
<script>
(function () {
  var el = document.getElementById('code');
  var text = el.textContent.trim();
  var pool = '!<>-_\\/[]{}=+*^?#%&@01ABCDEF';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var timer = null;

  function decode() {
    cancelAnimationFrame(el._raf);
    var q = Array.from(text).map(function (ch, i) {
      return { ch: ch, end: 12 + i * 1.6 + Math.random() * 14 };
    });
    var frame = 0, max = 0;
    q.forEach(function (o) { max = Math.max(max, o.end); });
    el.setAttribute('aria-live', 'off');
    function step() {
      var out = '';
      q.forEach(function (o) {
        if (frame >= o.end) out += o.ch;
        else if (o.ch === ' ') out += ' ';
        else out += pool[Math.floor(Math.random() * pool.length)];
      });
      el.textContent = out;
      frame++;
      if (frame <= max) el._raf = requestAnimationFrame(step);
      else { el.textContent = text; el._raf = null; }
    }
    step();
  }
  function loop() {
    decode();
    clearTimeout(timer);
    timer = setTimeout(loop, 4000);
  }
  loop();
  document.getElementById('again').addEventListener('click', loop);
})();
</script>
</body>
</html>
