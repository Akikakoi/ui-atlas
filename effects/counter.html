<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字滚动 · UI Atlas 动效</title>
<style>
:root{--bg:#0f1116;--ink:#f4f5f8;--muted:#8b90a0;--line:rgba(255,255,255,.12);--accent:#9db8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
.stage{min-height:100vh;display:grid;place-items:center;padding:38px 22px 70px}
.wrap{width:100%;max-width:520px}
.kicker{margin:0 0 14px;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--muted)}
h1{margin:0 0 30px;font-size:clamp(22px,5.4vw,32px);line-height:1.18;letter-spacing:-.03em;font-weight:600}
h1 em{font-style:normal;color:var(--accent)}
.stats{display:grid;gap:0}
.stat{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;padding:17px 0;border-top:1px solid var(--line)}
.stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.stat .v{font-size:clamp(28px,7vw,42px);line-height:1;letter-spacing:-.04em;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.42em;letter-spacing:0;color:var(--muted);margin-left:2px;font-weight:500}
.stat .sub{grid-column:1/-1;margin:0;font-size:11.5px;color:#6d7280}
.stat .track{grid-column:1/-1;height:2px;margin-top:8px;background:rgba(255,255,255,.08)}
.stat .track i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--accent),#6f8fe0);transform-origin:left;transform:scaleX(0);transition:transform 1.1s cubic-bezier(.16,.84,.3,1)}
.stats.in .track i{transform:scaleX(1)}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <p class="kicker">SCROLL / 06</p>
    <h1>数字不该「跳」出来，<br><em>它该走过来。</em></h1>
    <div class="stats" id="stats">
      <div class="stat"><span class="k">可用性</span><span class="v" data-to="99.98" data-dec="2">0.00<small>%</small></span><p class="sub">过去 90 天，全部区域加权</p><span class="track"><i style="--w:92%"></i></span></div>
      <div class="stat"><span class="k">每日部署</span><span class="v" data-to="1284" data-dec="0">0<small>次</small></span><p class="sub">平均 41 秒完成一次发布</p><span class="track"><i style="--w:74%"></i></span></div>
      <div class="stat"><span class="k">边缘节点</span><span class="v" data-to="37" data-dec="0">0<small>个</small></span><p class="sub">覆盖 21 个国家和地区</p><span class="track"><i style="--w:58%"></i></span></div>
    </div>
  </div>
</main>
<p class="hint">进入视口才开始计数</p>
<script>
(function () {
  var box = document.getElementById('stats');
  var vals = [].slice.call(box.querySelectorAll('.v'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false;

  function ease(t) { return 1 - Math.pow(1 - t, 3.2); }
  function paint(v, n) {
    var dec = +v.dataset.dec;
    v.firstChild.nodeValue = n.toLocaleString('zh-CN', {
      minimumFractionDigits: dec, maximumFractionDigits: dec
    });
  }
  function run() {
    if (done) return;
    done = true;
    box.classList.add('in');
    if (reduce) {
      vals.forEach(function (v) { paint(v, +v.dataset.to); });
      return;
    }
    var t0 = performance.now(), dur = 1300;
    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      vals.forEach(function (v, i) {
        var local = Math.min(1, Math.max(0, t * 1.15 - i * .08));
        paint(v, +v.dataset.to * ease(local));
      });
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  if (reduce) {
    vals.forEach(function (v) { paint(v, +v.dataset.to); });
    box.classList.add('in');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) run();
    }, { threshold: .3 }).observe(box);
  } else { run(); }
})();
</script>
</body>
</html>
