<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逐段入场 · 最小用法</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f4ef; color: #191b1f;
    font: 15px/1.7 system-ui, "PingFang SC", sans-serif;
  }
  .wrap {
    max-width: 560px; margin: 0 auto; padding: 18vh 22px 28vh;
    display: grid; gap: 18px;
  }
  .box {
    padding: 24px; border-radius: 14px; background: #fff;
    border: 1px solid #e2e0d8;
  }
  .box h2 { margin: 0 0 6px; font-size: 19px; }
  .box p { margin: 0; color: #5b5e65; font-size: 14px; }
  .reveal {
    opacity: 0; transform: translateY(24px);
    transition: opacity .6s cubic-bezier(.2, .8, .2, 1),
                transform .6s cubic-bezier(.2, .8, .2, 1);
  }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="box reveal">
    <h2>第一段</h2>
    <p>页面往下滚，这一块进入视口后自己浮上来。</p>
  </section>
  <section class="box reveal">
    <h2>第二段</h2>
    <p>只触发一次，滚回来不会重复播放。</p>
  </section>
  <section class="box reveal">
    <h2>第三段</h2>
    <p>减动效模式下直接显示，不做位移。</p>
  </section>
</main>
<script>
  const items = [...document.querySelectorAll('.reveal')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce || !('IntersectionObserver' in window)) {
    items.forEach((el) => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        en.target.classList.add('in');
        io.unobserve(en.target);
      });
    }, { threshold: .2 });
    items.forEach((el) => io.observe(el));
  }
</script>
</body>
</html>
