<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点击涟漪 · UI Atlas 动效</title>
<style>
:root{--bg:#f6f5f1;--ink:#111216;--muted:#7b7e85;--line:#e2dfd5;--accent:#2f5fd0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
.stage{min-height:100vh;display:grid;place-items:center;padding:38px 22px 74px}
.wrap{width:100%;max-width:480px}
.kicker{margin:0 0 14px;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--muted)}
h1{margin:0 0 26px;font-size:clamp(25px,6vw,38px);line-height:1.12;letter-spacing:-.035em;font-weight:640}
h1 em{font-style:normal;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;isolation:isolate;height:48px;padding:0 22px;border-radius:11px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:#fff;color:var(--ink);border-color:#d6d2c6}
.btn:active{transform:translateY(1px)}
.rp{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:rp .62s cubic-bezier(.2,.6,.2,1) forwards}
.ghost .rp{background:radial-gradient(circle,rgba(47,95,208,.3),rgba(47,95,208,0) 70%)}
@keyframes rp{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.note{margin:22px 0 0;font-size:12.5px;line-height:1.85;color:var(--muted);max-width:30em}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.rp{display:none}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <p class="kicker">FEEDBACK / 01</p>
    <h1>点在哪儿，<br><em>波纹就从哪儿起。</em></h1>
    <div class="row">
      <button class="btn" type="button">确认发布</button>
      <button class="btn ghost" type="button">取消</button>
    </div>
    <p class="note">波纹直径取按钮对角线，保证任何角落点击都能铺满；600ms 后自动移除节点，连点也不会堆 DOM。</p>
  </div>
</main>
<p class="hint">点按钮的不同位置试试</p>
<script>
(function () {
  [].forEach.call(document.querySelectorAll('.btn'), function (btn) {
    btn.addEventListener('pointerdown', function (e) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var r = btn.getBoundingClientRect();
      var d = Math.hypot(r.width, r.height) * 2;
      var x = e.clientX ? e.clientX - r.left : r.width / 2;
      var y = e.clientY ? e.clientY - r.top : r.height / 2;
      var s = document.createElement('span');
      s.className = 'rp';
      s.style.width = s.style.height = d + 'px';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      btn.appendChild(s);
      s.addEventListener('animationend', function () { s.remove(); });
      setTimeout(function () { if (s.parentNode) s.remove(); }, 900);
    });
  });
})();
</script>
</body>
</html>
