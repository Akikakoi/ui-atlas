<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点阵斥力 · UI Atlas 动效</title>
<style>
:root{--bg:#f4f2ec;--ink:#111216;--muted:#797c83;--accent:#2f5fd0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:34px 24px;text-align:center;pointer-events:none}
.kicker{margin:0 0 14px;font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,7vw,48px);line-height:1.05;letter-spacing:-.04em;font-weight:650}
h1 em{font-style:normal;color:var(--accent)}
p.sub{max-width:24em;margin:16px auto 0;font-size:12.5px;line-height:1.85;color:var(--muted)}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);z-index:3;pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){
  canvas{display:none}
  body{background-image:radial-gradient(circle,#c6c2b5 1.1px,transparent 1.3px);background-size:26px 26px;background-position:center}
}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main class="stage">
  <div>
    <p class="kicker">POINTER / 06</p>
    <h1>光标走过，<br><em>点阵会让路。</em></h1>
    <p class="sub">每个点只在自己的格点附近退让 18px，离开后按 0.16 的系数弹回去；距离越近，点越亮也越大。</p>
  </div>
</main>
<p class="hint">移动光标穿过点阵</p>
<script>
(function () {
  var c = document.getElementById('c');
  if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = c.getContext('2d');
  var W = 0, H = 0, DPR = 1, dots = [], raf = null, running = true;
  var mouse = { x: -9999, y: -9999 };
  var R = 130, PUSH = 18, EASE = .16;

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    c.width = W * DPR; c.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var gap = Math.max(24, Math.round(Math.sqrt(W * H / 680)));
    var cols = Math.ceil(W / gap) + 2, rows = Math.ceil(H / gap) + 2;
    var ox = (W - (cols - 1) * gap) / 2, oy = (H - (rows - 1) * gap) / 2;
    dots = [];
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var bx = ox + x * gap, by = oy + y * gap;
        dots.push({ bx: bx, by: by, x: bx, y: by });
      }
    }
  }

  function step() {
    raf = null;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var dx = d.bx - mouse.x, dy = d.by - mouse.y;
      var md = Math.hypot(dx, dy);
      var tx = d.bx, ty = d.by, near = 0;
      if (md < R && md > .1) {
        near = 1 - md / R;
        tx = d.bx + dx / md * PUSH * near;
        ty = d.by + dy / md * PUSH * near;
      }
      d.x += (tx - d.x) * EASE;
      d.y += (ty - d.y) * EASE;

      ctx.fillStyle = 'rgba(47,95,208,' + (.20 + near * .62).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(d.x, d.y, 1.25 + near * .9, 0, Math.PI * 2);
      ctx.fill();
    }
    if (running) raf = requestAnimationFrame(step);
  }

  function aim(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
  addEventListener('resize', resize);
  addEventListener('pointermove', aim, { passive: true });
  addEventListener('pointerleave', function () { mouse.x = -9999; mouse.y = -9999; });
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running && !raf) raf = requestAnimationFrame(step);
  });

  resize();
  step();
})();
</script>
</body>
</html>
