<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打字机 · UI Atlas 动效</title>
<style>
:root{--bg:#f6f5f1;--ink:#111216;--muted:#7c7f86;--accent:#2f5fd0;--line:#dfdcd2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
.stage{min-height:100vh;display:grid;place-items:center;padding:38px 22px 74px}
.wrap{width:100%;max-width:560px}
.kicker{margin:0 0 16px;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--muted)}
.line{display:flex;align-items:baseline;gap:2px;min-height:1.5em;font-size:clamp(24px,6vw,40px);line-height:1.45;
  letter-spacing:-.035em;font-weight:600}
.line .prompt{color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:.62em;transform:translateY(-.12em);margin-right:6px}
#txt{white-space:pre-wrap}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);translate:0 .14em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.85;color:var(--muted);max-width:32em}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <p class="kicker">TYPE / 03</p>
    <div class="line"><span class="prompt">&gt;</span><span id="txt"></span><span class="caret" id="caret"></span></div>
    <p class="sub">打字用 55ms/字，删字快一倍（28ms）；整句停 1.4 秒再退格。光标单独闪烁，不跟着字一起重绘。</p>
  </div>
</main>
<p class="hint">它会自己循环</p>
<script>
(function () {
  var txt = document.getElementById('txt');
  var lines = ['把一个想法做完。', '让页面会呼吸。', '把复杂留给自己。'];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { txt.textContent = lines[0]; return; }

  var i = 0, pos = 0, deleting = false;
  function tick() {
    var s = lines[i];
    if (!deleting) {
      pos++;
      txt.textContent = s.slice(0, pos);
      if (pos === s.length) { deleting = true; return setTimeout(tick, 1400); }
      return setTimeout(tick, 62 + Math.random() * 48);
    }
    pos--;
    txt.textContent = s.slice(0, pos);
    if (pos === 0) {
      deleting = false;
      i = (i + 1) % lines.length;
      return setTimeout(tick, 300);
    }
    setTimeout(tick, 28);
  }
  setTimeout(tick, 400);
})();
</script>
</body>
</html>
