<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 倾斜卡片 · UI Atlas 动效</title>
<style>
:root{--bg:#0e1117;--ink:#f2f4f8;--muted:#8b93a7;--accent:#8fb4ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:
  radial-gradient(600px 300px at 50% -10%,rgba(80,120,220,.28),transparent 70%),
  radial-gradient(400px 240px at 100% 100%,rgba(160,90,220,.18),transparent 70%),var(--bg);
  color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif;overflow-x:hidden}
.stage{min-height:100vh;display:grid;place-items:center;padding:36px 22px 70px}
.scene{perspective:900px;width:min(340px,86vw)}
.card{position:relative;aspect-ratio:1.62;border-radius:18px;padding:20px;color:#0c1220;
  background:linear-gradient(135deg,#e9eeff 0%,#c9d8ff 46%,#a7bdff 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.9);
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);
  will-change:transform;cursor:grab;overflow:hidden}
.card.on{transition:transform .1s linear}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(280px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.85),transparent 60%);
  mix-blend-mode:screen;opacity:.7}
.card>*{position:relative;z-index:1;transform:translateZ(26px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;font:600 10px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.16em}
.brand{font:700 12px/1 -apple-system,"Segoe UI",sans-serif;letter-spacing:.02em}
.chip{width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#f7d774,#c99b28);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.mid{margin-top:22px}
.mid b{display:block;font-size:clamp(17px,4.4vw,22px);letter-spacing:-.02em}
.mid span{display:block;margin-top:3px;font:600 10.5px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.1em;opacity:.6}
.bot{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;
  font:600 10.5px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.08em;transform:translateZ(38px)}
.bot em{font-style:normal;font-size:15px;letter-spacing:.06em}
.floor{width:min(340px,86vw);height:26px;margin:20px auto 0;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(18px)}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div>
    <div class="scene">
      <div class="card" id="card">
        <div class="top"><span class="brand">UI ATLAS</span><span class="chip"></span></div>
        <div class="mid"><b>林柯</b><span>MEMBER · 0042</span></div>
        <div class="bot"><span>VALID<br>12 / 2029</span><em>◆</em></div>
      </div>
    </div>
    <div class="floor"></div>
  </div>
</main>
<p class="hint">在卡片上移动光标，注意高光与层深</p>
<script>
(function () {
  var card = document.getElementById('card');
  if (!card || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var on = false;
  card.addEventListener('pointerenter', function () { on = true; card.classList.add('on'); });
  card.addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.style.transform = 'rotateX(' + ((.5 - py) * 16).toFixed(2) + 'deg) rotateY(' + ((px - .5) * 18).toFixed(2) + 'deg)';
    card.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    card.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  });
  card.addEventListener('pointerleave', function () {
    on = false; card.classList.remove('on'); card.style.transform = '';
  });
})();
</script>
</body>
</html>
