<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长按确认 · PAPERFLY 云盘 · UI Atlas</title>
<style>
:root{--bg:#edf0f4;--paper:#fbfcfe;--ink:#14181f;--muted:#77808d;--line:#dbe0e7;--accent:#2f5fd0;--danger:#b83b30;--ok:#2f6b45;--chip:#f1f4f8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit}
.page{min-height:100svh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;flex:0 0 auto;height:54px;display:flex;align-items:center;gap:20px;padding:0 clamp(16px,3.2vw,36px);border-bottom:1px solid var(--line);background:rgba(251,252,254,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:11.5px;letter-spacing:.18em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 10px/1 ui-monospace,Consolas,monospace}
.brand small{font:500 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted)}
.topbar nav{display:flex;gap:18px;font-size:11.5px;color:var(--muted)}
.topbar nav a.on{color:var(--ink);font-weight:600}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.02em;color:var(--muted);pointer-events:none;background:rgba(128,128,128,.10);border:1px solid rgba(128,128,128,.16);border-radius:999px;padding:3px 8px;white-space:nowrap}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.quota{margin-left:auto;display:flex;align-items:center;gap:9px;font:600 8px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.quota .bar{width:74px;height:4px;border-radius:2px;background:#e2e7ee;overflow:hidden}
.quota .bar i{display:block;height:100%;width:43%;background:var(--accent);border-radius:2px}
.avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(145deg,#7e93b8,#3d4f6d);color:#f3f6fb;display:grid;place-items:center;font:700 10px/1 ui-monospace,Consolas,monospace}
.shell{flex:1;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:176px minmax(0,1fr);gap:clamp(22px,3.4vw,44px);padding:clamp(16px,2.8vh,26px) clamp(16px,3.2vw,38px) 32px;align-items:start}
.side{position:sticky;top:74px;display:flex;flex-direction:column;gap:2px}
.side-k{margin:0 0 8px;font:600 8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.17em;color:var(--muted)}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:8px;font-size:11.5px;color:var(--muted);transition:background .18s,color .18s}
.side a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.side a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 10px 20px -20px rgba(20,22,30,.45)}
.side a small{font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em;color:var(--muted)}
.main{min-width:0}
.crumb{display:flex;align-items:center;gap:7px;font:500 8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}
.crumb b{color:var(--ink);font-weight:600}
.crumb span{color:#b3bac4}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:13px}
.head h1{margin:0;font-size:clamp(21px,2.6vw,27px);line-height:1.15;letter-spacing:-.035em;font-weight:640}
.head p{margin:5px 0 0;font-size:10.5px;color:var(--muted)}
.head .new{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 13px;font-size:11px;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:12px;align-items:start}
.files{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;box-shadow:0 30px 50px -55px rgba(20,22,30,.45)}
.file{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid #eef1f5;background:transparent;padding:10px 12px;cursor:pointer;transition:background .16s}
.file:first-child{border-top:0}
.file:hover{background:#f6f8fb}
.file:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.file.on{background:#eef3ff}
.file.removed{opacity:.42}
.file.removed .name b{text-decoration:line-through}
.file .ico{width:28px;height:28px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font:700 7.5px/1 ui-monospace,Consolas,monospace;color:#8792a1}
.file.on .ico{background:#dfe8ff;color:var(--accent)}
.file .name b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .name small{display:block;margin-top:1px;font-size:9px;color:var(--muted)}
.file .meta{text-align:right;font:600 8px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.file .meta .tag{display:inline-block;margin-top:2px;border:1px solid rgba(47,95,208,.26);color:var(--accent);border-radius:999px;padding:2px 5px;font-size:6.5px;letter-spacing:.08em}
.file.removed .meta .tag{border-color:rgba(184,59,48,.3);color:var(--danger)}
.detail{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px;box-shadow:0 30px 50px -55px rgba(20,22,30,.4)}
.detail-k{margin:0 0 10px;font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--muted)}
.dtop{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid #eef1f5}
.dtop .ico{width:36px;height:36px;border-radius:9px;flex:0 0 36px;display:grid;place-items:center;background:#eef3ff;color:var(--accent);font:700 8px/1 ui-monospace,Consolas,monospace}
.dtop b{display:block;font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop small{display:block;margin-top:2px;font-size:9px;color:var(--muted)}
.dmeta{display:grid;gap:6px;padding:10px 0 12px;font-size:10px}
.dmeta div{display:flex;justify-content:space-between;gap:10px}
.dmeta small{font:600 7.5px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.07em;color:var(--muted)}
.dmeta b{font-weight:600}
.hold{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;border:1px solid #e4c3be;border-radius:10px;background:#fff;color:var(--danger);font:inherit;font-size:12px;font-weight:600;cursor:pointer;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .2s,border-color .2s,color .2s}
.hold:hover{background:#fdf7f6}
.hold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hold.done{border-color:#c8ddcc;background:#f4faf5;color:var(--ok)}
.ring{width:19px;height:19px;flex:0 0 19px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.4}
.ring .bg{stroke:#f0d9d5}
.hold.done .ring .bg{stroke:#d8e8db}
.ring .fg{stroke:var(--danger);stroke-linecap:round;stroke-dasharray:106.8;stroke-dashoffset:106.8}
.hold.done .ring .fg{stroke:#3c8558;stroke-dashoffset:0}
.msg{margin:8px 0 0;min-height:30px;font-size:10px;line-height:1.55;color:var(--muted);text-align:center}
.foot{flex:0 0 auto;border-top:1px solid var(--line);padding:11px clamp(16px,3.2vw,38px);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font:600 8px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted)}
@media (max-width:1000px){
  .grid{grid-template-columns:minmax(0,1fr) 240px}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;padding-top:15px}
  .side{display:none}
  .grid{grid-template-columns:1fr 240px}
}
@media (max-width:560px){
  .topbar{height:50px;padding:0 14px;gap:10px}
  .topbar nav,.hint,.quota{display:none}
  .shell{padding:16px 14px 26px}
  .head h1{font-size:22px}
  .grid{grid-template-columns:1fr;gap:10px}
  .detail{order:-1}
  .file .meta{display:none}
  .foot{display:none}
}
@media (max-height:560px) and (min-width:561px){
  .topbar{height:40px;padding:0 16px;gap:14px}
  .topbar nav,.quota{display:none}
  .hint{left:auto;right:14px;top:50%;transform:translateY(-50%);font-size:9px;padding:2px 7px}
  .shell{grid-template-columns:1fr;max-width:600px;padding:9px 16px 10px;gap:0}
  .side{display:none}
  .crumb{margin-bottom:5px;font-size:7.5px}
  .head{margin-bottom:7px}
  .head h1{font-size:18px}
  .head p{display:none}
  .head .new{padding:5px 9px;font-size:9.5px;border-radius:7px}
  .grid{grid-template-columns:minmax(0,1fr) 218px;gap:9px}
  .file{padding:6px 9px;gap:8px;grid-template-columns:24px minmax(0,1fr) auto}
  .file .ico{width:24px;height:24px;border-radius:6px;font-size:6.5px}
  .file .name b{font-size:10px}
  .file .name small{font-size:8px}
  .file .meta{font-size:7px}
  .detail{padding:10px}
  .detail-k{font-size:7px;margin-bottom:6px}
  .dtop{padding-bottom:7px;gap:7px}
  .dtop .ico{width:30px;height:30px;flex:0 0 30px;border-radius:7px}
  .dtop b{font-size:10px}
  .dtop small{font-size:8px}
  .dmeta{gap:3px;padding:6px 0 8px;font-size:9px}
  .hold{height:34px;font-size:10.5px;gap:6px;border-radius:8px}
  .ring{width:16px;height:16px;flex:0 0 16px}
  .msg{min-height:24px;margin-top:5px;font-size:8.5px}
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hold,.file,.side a{transition:none}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="#main"><span class="mark">P</span>PAPERFLY<small>云盘</small></a>
    <nav aria-label="主导航"><a class="on" href="#main">文件</a><a href="#main">共享</a><a href="#main">最近</a><a href="#main">回收站</a></nav>
    <p class="hint">按住删除按钮别松手，满 1 秒才删除</p>
    <span class="quota">42.6 / 100 GB<span class="bar"><i></i></span></span>

      <a href="#main">品牌项目 <small>24</small></a>
      <a href="#main">照片 <small>312</small></a>

<script>
(function () {
  var btn = document.getElementById('hold'), fg = document.getElementById('fg');
  var label = document.getElementById('label'), msg = document.getElementById('msg');
  var dName = document.getElementById('dName'), dSize = document.getElementById('dSize'), dTime = document.getElementById('dTime'), dIcon = document.getElementById('dIcon');
  var files = [].slice.call(document.querySelectorAll('.file'));
  var C = 2 * Math.PI * 17;
  var start = 0, raf = null, holding = false, done = false, fadeTimer = null;
  var current = files[0];

  fg.style.strokeDasharray = C;
  fg.style.strokeDashoffset = C;

  function currentName() {
    return current.dataset.name;
  }

  function idle() {
    label.textContent = '按住 1 秒删除';
    btn.classList.remove('done');
    btn.setAttribute('aria-label', '按住 1 秒删除「' + currentName() + '」');
    fg.style.transition = 'none';
    fg.style.strokeDashoffset = C;
  }

  function begin() {
    if (done || holding) return;
    holding = true;
    start = performance.now();
    clearTimeout(fadeTimer);
    fg.style.transition = 'none';
    label.textContent = '保持住…';
    msg.textContent = '松开即取消';
    raf = requestAnimationFrame(frame);
  }

  function frame(now) {
    if (!holding) return;
    var p = Math.min(1, (now - start) / 1000);
    fg.style.strokeDashoffset = String(C * (1 - p));
    if (p >= 1) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }

  function cancel() {
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(raf);
    raf = null;
    label.textContent = '按住 1 秒删除';
    msg.textContent = '';
    fg.style.transition = 'stroke-dashoffset .3s ease';
    fg.style.strokeDashoffset = C;
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function () { fg.style.transition = 'none'; }, 320);
  }

  function finish() {
    holding = false;
    done = true;
    cancelAnimationFrame(raf);
    raf = null;
    fg.style.transition = 'none';
    fg.style.strokeDashoffset = '0';
    btn.classList.add('done');
    label.textContent = '已删除 · 点此撤销';
    btn.setAttribute('aria-label', '已删除，点按撤销');
    msg.textContent = '「' + currentName() + '」已移到回收站。';
    current.classList.add('removed');
    var tag = current.querySelector('.meta .tag');
    if (!tag) {
      tag = document.createElement('span');
      tag.className = 'tag';
      current.querySelector('.meta').appendChild(tag);
    }
    tag.textContent = '已删除';
  }

  function reset() {
    done = false;
    btn.classList.remove('done');
    label.textContent = '按住 1 秒删除';
    btn.setAttribute('aria-label', '按住 1 秒删除「' + currentName() + '」');
    msg.textContent = '已撤销。';
    fg.style.transition = 'none';
    fg.style.strokeDashoffset = C;
    current.classList.remove('removed');
    var tag = current.querySelector('.meta .tag');
    if (tag) tag.remove();
  }

  files.forEach(function (f) {
    f.addEventListener('click', function () {
      if (holding) return;
      if (done) reset();
      files.forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
      f.classList.add('on');
      f.setAttribute('aria-pressed', 'true');
      current = f;
      var ext = f.dataset.name.split('.').pop().toUpperCase();
      dName.textContent = f.dataset.name;
      dIcon.textContent = ext;
      dSize.textContent = ext + ' · ' + f.dataset.size;
      dTime.textContent = f.dataset.time;
      idle();
      msg.textContent = '';
      files.forEach(function (x) {
        x.querySelectorAll('.meta .tag').forEach(function (t) {
          if (t.textContent === '当前') t.remove();
        });
      });
      if (!f.classList.contains('removed')) {
        var t = document.createElement('span');
        t.className = 'tag';
        t.textContent = '当前';
        f.querySelector('.meta').appendChild(t);
      }
    });
  });

  btn.addEventListener('pointerdown', function (e) {
    if (done) { reset(); return; }
    e.preventDefault();
    btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
    begin();
  });
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('pointerleave', cancel);

  btn.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (done) { reset(); return; }
    if (!e.repeat) begin();
  });
  btn.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') cancel();
  });
  btn.addEventListener('blur', cancel);

  idle();
})();
</script>
<script>
/* 页内锚点：点击后平滑滚到对应区块；减动效用户仍直接跳转 */
(function () {
  var root = document.documentElement;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  var raf = 0;

  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    if (root.style.scrollBehavior) root.style.scrollBehavior = '';
    if (root.style.scrollSnapType) root.style.scrollSnapType = '';
  }

  function run(y) {
    var from = window.pageYOffset;
    var delta = y - from;
    if (!delta) return;
    root.style.scrollBehavior = 'auto';
    if (getComputedStyle(root).scrollSnapType !== 'none') root.style.scrollSnapType = 'none';
    var dur = Math.min(900, Math.max(320, Math.abs(delta) * 0.5));
    var t0 = 0;
    function frame(now) {
      if (!t0) t0 = now;
      var p = Math.min(1, (now - t0) / dur);
      window.scrollTo(0, from + delta * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(frame);
      else stop();
    }
    raf = requestAnimationFrame(frame);
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var el = id && document.getElementById(id);
    if (!el || !el.getClientRects().length) return;
    if (reduce.matches) return;
    e.preventDefault();
    var gap = (parseFloat(getComputedStyle(el).scrollMarginTop) || 0) +
              (parseFloat(getComputedStyle(root).scrollPaddingTop) || 0);
    var max = root.scrollHeight - window.innerHeight;
    var y = Math.max(0, Math.min(max, el.getBoundingClientRect().top + window.pageYOffset - gap));
    stop();
    run(y);
    if (history.pushState) history.pushState(null, '', '#' + id);
  });

  ['wheel', 'touchstart', 'keydown'].forEach(function (t) {
    addEventListener(t, stop, { passive: true });
  });
})();
</script>
