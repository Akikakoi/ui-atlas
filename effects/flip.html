<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字翻转替换 · UI Atlas 动效</title>
<style>
:root{--bg:#f7f6f2;--ink:#111216;--muted:#7c7f86;--line:#e2dfd5;--accent:#2f5fd0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
.stage{min-height:100vh;display:grid;place-items:center;padding:38px 22px 74px}
.wrap{width:100%;max-width:540px}
.kicker{margin:0 0 14px;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--muted)}
h1{margin:0 0 30px;font-size:clamp(27px,6.4vw,44px);line-height:1.1;letter-spacing:-.04em;font-weight:620}
h1 em{font-style:normal;color:var(--accent)}
.nav{display:grid;border-top:1px solid var(--line)}
.nav a{display:flex;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;font-size:clamp(17px,4vw,22px);letter-spacing:-.02em}
.nav a small{margin-left:auto;font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted)}
.slot{display:inline-grid;overflow:hidden;height:1.32em;line-height:1.32em;vertical-align:bottom}
.slot span{grid-area:1/1;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.slot .en{transform:translate3d(0,110%,0);color:var(--accent);font-style:italic;font-family:Georgia,serif;font-size:.94em;letter-spacing:.01em}
.nav a:hover .zh{transform:translate3d(0,-110%,0)}
.nav a:hover .en{transform:none}
.note{margin:22px 0 0;font-size:12.5px;line-height:1.85;color:var(--muted);max-width:32em}
.hint{position:fixed;left:16px;bottom:14px;margin:0;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--muted);pointer-events:none}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.slot span{transition:none}}

/* hint 胶囊：滚动页里不会与正文糊在一起 */
.hint{background:rgba(128,128,128,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(128,128,128,.18);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <p class="kicker">TYPE / 05</p>
    <h1>两行字住一个窗口，<br><em>只在悬停时换班。</em></h1>
    <nav class="nav">
      <a href="#work"><span class="slot"><span class="zh">作品</span><span class="en">Selected Work</span></span><small>12</small></a>
      <a href="#notes"><span class="slot"><span class="zh">笔记</span><span class="en">Field Notes</span></span><small>34</small></a>
      <a href="#about"><span class="slot"><span class="zh">关于</span><span class="en">About</span></span><small>→</small></a>
    </nav>
    <p class="note">高度锁在 1.32em，两行各自从 110% 滑进滑出。窗口 overflow:hidden，所以不会盖到下一行。</p>
  </div>
</main>
<p class="hint">悬停中间的三行链接</p>
</body>
</html>
