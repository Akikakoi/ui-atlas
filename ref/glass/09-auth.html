<main class="auth">
  <section class="auth-brand">
    <span class="side-brand" style="padding:0"><span class="mark">◆</span> Northwind</span>

    <div>
      <p class="quote">「我们之前用表格记续费，每次月底都要对账到十一点。<b>现在打开就有数。</b>」</p>
      <div class="who" style="margin-top:var(--space-5)">
        <span class="avatar accent">林</span>
        <span>林见夏 · 林间设计工作室 · 团队版 12 席</span>
      </div>
    </div>

    <div class="points">
      <div>14 天试用，不用信用卡</div>
      <div>数据随时导出，不做锁定</div>
      <div>中文界面与中文支持</div>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card card pad">
      <h1>登录</h1>
      <p class="sub">欢迎回来。用工作邮箱继续。</p>

      <form onsubmit="return false">
        <div class="field">
          <label class="label" for="a-email">邮箱</label>
          <input class="input" id="a-email" type="email" value="lin@studio.cn" autocomplete="username">
        </div>

        <div class="field is-error">
          <label class="label" for="a-pw">密码</label>
          <div class="pw">
            <input class="input" id="a-pw" type="password" value="1234" autocomplete="current-password"
                   aria-invalid="true" aria-describedby="a-pw-help">
            <button class="peek" type="button">显示</button>
          </div>
          <span class="help" id="a-pw-help">密码至少 8 位，还可以再输 2 次</span>
        </div>

        <div class="row" style="justify-content:space-between">
          <label class="check"><input type="checkbox" checked><span>记住这台设备</span></label>
          <a href="#" class="t-sm">忘记密码？</a>
        </div>

        <button class="btn primary" type="submit" style="justify-content:center">登录</button>

        <div class="or">或</div>

        <div class="auth-alt">
          <button class="btn" type="button">用企业 SSO 登录</button>
          <button class="btn ghost" type="button">发送邮箱验证码</button>
        </div>
      </form>

      <p class="legal">
        还没有账号？<a href="08-marketing.html#pricing">看定价并开始试用</a>。
        继续即表示同意<a href="#">服务条款</a>与<a href="#">隐私政策</a>。
      </p>
    </div>
  </section>
</main>

</body>
</html>
