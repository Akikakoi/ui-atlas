<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Atlas · 网页 UI 风格与动效图鉴</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="60 个网页 UI 风格样例 + 100 个可交互动效：落地页 / 后台 / App 三种形态，颜色与圆角写成 CSS 变量，可实时改、可分享、可导出 Tailwind / shadcn。">
<link rel="stylesheet" href="site.css?v=13">
</head>
<body>
<a class="skip" href="#grid">跳到图鉴</a>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <h1>UI Atlas</h1>
        <p><span id="n-sub">60</span> 个风格 · 100 个动效 · 都可看源码</p>
      </div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="搜：玻璃、圆角0、深色、等宽…" aria-label="搜索风格、特征或 token">
      <span class="spacer"></span>
      <span class="picked" id="picked-info" aria-live="polite">未选</span>
      <button class="btn primary" id="compare-btn" disabled>对比</button>
    </div>
  </div>
  <div class="filterbar">
    <div class="dd" data-dd="group">
      <button class="dd-btn" type="button" aria-expanded="false" aria-haspopup="true">
        <span class="dd-k">分组</span><span class="dd-v">全部</span><span class="dd-caret" aria-hidden="true">▾</span>
      </button>
      <div class="dd-menu" hidden>
        <button class="chip" data-k="group" data-v="" aria-pressed="true">全部 <small id="n-all"></small></button>
        <button class="chip" data-k="group" data-v="classic" aria-pressed="false">经典 UI <small id="n-classic"></small></button>
        <button class="chip" data-k="group" data-v="shift" aria-pressed="false">风格平移 <small id="n-shift"></small></button>
      </div>
    </div>
    <div class="dd" data-dd="form">
      <button class="dd-btn" type="button" aria-expanded="false" aria-haspopup="true">
        <span class="dd-k">形态</span><span class="dd-v">全部</span><span class="dd-caret" aria-hidden="true">▾</span>
      </button>
      <div class="dd-menu" hidden>
        <button class="chip" data-k="form" data-v="" aria-pressed="true">全部 <small id="n-form-all"></small></button>
        <button class="chip" data-k="form" data-v="landing" aria-pressed="false">落地页 <small id="n-landing"></small></button>
        <button class="chip" data-k="form" data-v="admin" aria-pressed="false">后台 <small id="n-admin"></small></button>
        <button class="chip" data-k="form" data-v="app" aria-pressed="false">App <small id="n-app"></small></button>
      </div>
    </div>
    <div class="dd" data-dd="layout">
      <button class="dd-btn" type="button" aria-expanded="false" aria-haspopup="true">
        <span class="dd-k">版式</span><span class="dd-v">全部</span><span class="dd-caret" aria-hidden="true">▾</span>
      </button>
      <div class="dd-menu" hidden>
        <button class="chip" data-k="layout" data-v="" aria-pressed="true">全部</button>
        <button class="chip" data-k="layout" data-v="landing" aria-pressed="false">落地页 <small id="n-lay-landing"></small></button>
        <button class="chip" data-k="layout" data-v="grid" aria-pressed="false">网格 <small id="n-lay-grid"></small></button>
        <button class="chip" data-k="layout" data-v="poster" aria-pressed="false">海报 <small id="n-lay-poster"></small></button>
        <button class="chip" data-k="layout" data-v="console" aria-pressed="false">控制台 <small id="n-lay-console"></small></button>
        <button class="chip" data-k="layout" data-v="article" aria-pressed="false">长文 <small id="n-lay-article"></small></button>
      </div>
    </div>
    <div class="dd right" data-dd="mine">
      <button class="dd-btn" type="button" aria-expanded="false" aria-haspopup="true">
        <span class="dd-k">我的</span><span class="dd-v">未设置</span><span class="dd-caret" aria-hidden="true">▾</span>
      </button>
      <div class="dd-menu" hidden>
        <button class="chip" data-k="fav" data-v="1" aria-pressed="false">收藏 <small id="n-fav">0</small></button>
        <button class="chip" data-k="recent" data-v="1" aria-pressed="false">最近 <small id="n-recent">0</small></button>
      </div>
    </div>
    <span class="spacer"></span>
    <a class="ref-link" href="motion.html">动效系统 →</a>
    <a class="ref-link" href="effects.html">动效图鉴 · 100 →</a>
    <a class="ref-link" href="ref.html">参考实现 · Glass →</a>
    <span class="count" id="count-info"></span>
  </div>
</header>

<main id="grid" class="grid" aria-live="polite"></main>

<footer class="foot">
  <p>每个样例都是零依赖单文件 HTML，复制即可用；tokens 与提示词按同一套命名。样例由 <code>tools/gen_demos.py</code> 生成，数据由 <code>tools/check.py</code> 校验；动效在 <code>effects/</code>，由 <code>tools/check_effects.py</code> 校验。</p>
  <p>内容为学习与设计参考：所有样例均为本站自行实现，未复制任何第三方站点的代码或素材。</p>
</footer>

<!-- 对比 -->
<div class="overlay" id="compare" hidden>
  <div class="compare-box" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <header class="compare-head">
      <h2 id="c-title">对比</h2>
      <div class="compare-tools">
        <label class="switch"><input type="checkbox" id="c-sync" checked> 同步滚动</label>
        <button class="btn" id="c-diff-toggle" aria-expanded="true" aria-controls="c-diff">差异</button>
        <button class="btn primary" id="c-close">关闭</button>
      </div>
    </header>
    <p class="c-conclusion" id="c-conclusion"></p>
    <div class="compare-body" id="c-body"></div>
    <section class="c-diff" id="c-diff">
      <table>
        <caption class="sr">两个风格的 token 差异</caption>
        <thead><tr><th scope="col">token</th><th scope="col" id="c-th-a">A</th><th scope="col" id="c-th-b">B</th></tr></thead>
        <tbody id="c-diff-body"></tbody>
      </table>
    </section>
  </div>
</div>

<script src="app.js?v=12"></script>

</body>
</html>
