<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Atlas · 打开原页</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="在完整页面里查看单个动效，也可以切到 600 × 450 画板对照构图。">
<link rel="stylesheet" href="site.css?v=16">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink); overflow: hidden;
  }
  .v-bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .v-name { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .v-name h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
  .v-name p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px;
    padding: 5px 11px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20,20,20,.12); }
  .v-link { font-size: 12.5px; color: var(--muted); text-decoration: none; padding: 6px 2px; }
  .v-link:hover { color: var(--accent); }
  .v-stage {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    background:
      radial-gradient(circle at 50% 40%, #fbfaf6, var(--bg) 70%);
  }
  .v-stage iframe {
    position: absolute; left: 50%; top: 50%; width: 600px; height: 450px;
    border: 0; background: #fff; transform-origin: center center;
    box-shadow: 0 18px 60px -22px rgba(20,22,30,.45);
    border-radius: 6px;
  }
  .v-stage.live iframe {
    left: 0; top: 0; width: 100%; height: 100%; transform: none;
    box-shadow: none; border-radius: 0;
  }
  .v-note {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.7;
    max-width: 460px;
  }
  .v-note code { font-size: 12px; }
  @media (max-width: 720px) {
    .v-bar { padding: 8px 12px; gap: 6px 10px; }
    .v-name p { display: none; }
    .v-name h1 { font-size: 15px; }
    .v-tools { margin-left: 0; width: 100%; justify-content: space-between; }
    .v-link { padding: 4px 0; }
  }
  @media (max-width: 470px) {
    .v-tools { justify-content: flex-start; gap: 6px 12px; }
    .seg { flex: 1 1 100%; }
    .seg button { flex: 1; text-align: center; }
    .v-link { font-size: 12px; }
  }

</style>
</head>
<body>

<header class="v-bar">
  <div class="v-name">
    <h1 id="v-title">加载中…</h1>
    <p id="v-sub"></p>
  </div>
  <div class="v-tools">
    <div class="seg" role="group" aria-label="显示方式">
      <button type="button" id="v-live" aria-pressed="true">真实页面</button>
      <button type="button" id="v-fit" aria-pressed="false">画板 600×450</button>
    </div>
    <a class="v-link" id="v-raw" href="#" target="_blank" rel="noopener">原始文件 ↗</a>
    <a class="v-link" id="v-back" href="effects.html">← 动效图鉴</a>
  </div>
</header>

<main class="v-stage" id="v-stage">
  <iframe id="v-frame" title="效果原页"></iframe>
</main>

<script>
(function () {
  var stage = document.getElementById('v-stage');
  var frame = document.getElementById('v-frame');
  var title = document.getElementById('v-title');
  var sub = document.getElementById('v-sub');
  var raw = document.getElementById('v-raw');
  var fitBtn = document.getElementById('v-fit');
  var liveBtn = document.getElementById('v-live');

  var ART_W = 600, ART_H = 450, PAD = 36, MAX_SCALE = 4;

  var params = new URLSearchParams(location.search);
  var id = params.get('id') || decodeURIComponent((location.hash || '').replace(/^#/, ''));
  var wantLive = params.get('mode') !== 'fit';

  function note(html) {
    var p = document.createElement('p');
    p.className = 'v-note';
    p.innerHTML = html;
    stage.appendChild(p);
    frame.style.display = 'none';
  }

  function fit() {
    if (stage.classList.contains('live')) { frame.style.transform = 'none'; return; }
    var w = stage.clientWidth - PAD, h = stage.clientHeight - PAD;
    if (w < 40 || h < 40) return;
    var s = Math.min(w / ART_W, h / ART_H);
    s = Math.max(.2, Math.min(MAX_SCALE, s));
    frame.style.transform = 'translate(-50%,-50%) scale(' + s.toFixed(4) + ')';
  }

  function setMode(live, sync) {
    stage.classList.toggle('live', live);
    fitBtn.setAttribute('aria-pressed', live ? 'false' : 'true');
    liveBtn.setAttribute('aria-pressed', live ? 'true' : 'false');
    fit();
    if (sync !== false) {
      var u = new URL(location.href);
      if (live) u.searchParams.delete('mode');
      else u.searchParams.set('mode', 'fit');
      history.replaceState(null, '', u);
    }
  }

  fitBtn.addEventListener('click', function () { setMode(false); });
  liveBtn.addEventListener('click', function () { setMode(true); });
  addEventListener('resize', fit);

  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (history.length > 1) history.back();
    else window.close();
  });

  if (!id) {
    note('链接里缺少效果 id。<br>从 <a href="effects.html">动效图鉴</a> 点「原页」进来，或直接访问 <code>view.html?id=magnetic</code>。');
    title.textContent = '打开原页';
    return;
  }

  fetch('effects.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var e = (data.effects || []).filter(function (x) { return x.id === id; })[0];
      if (!e) {
        note('没找到 id 为 <code>' + id + '</code> 的效果，可能拼错了。');
        title.textContent = '打开原页';
        return;
      }
      var fam = (data.families || []).filter(function (f) { return f.id === e.family; })[0] || {};
      var cat = (data.cats || []).filter(function (c) { return c.id === e.cat; })[0] || {};
      title.textContent = e.name;
      document.title = e.name + ' · UI Atlas';
      sub.textContent = [e.name_en, cat.name, fam.name].filter(Boolean).join(' · ') +
        ' · 真实页面 · 可切 600×450 画板';
      raw.href = e.demo + '?v=' + (data.demoV || '1');
      frame.title = e.name + ' 页面';
      frame.src = e.demo + '?v=' + (data.demoV || '1');
      fit();
    })
    .catch(function () {
      note('读不到 effects.json。<br>请用 <code>python serve.py</code> 打开本站——<code>file://</code> 会被浏览器拦截 fetch。');
      title.textContent = '打开原页';
    });

  setMode(wantLive, false);
})();
</script>
</body>
</html>
